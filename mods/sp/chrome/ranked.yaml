Background@RANKED_PANEL:
	Logic: RankedLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 520
	Height: 400
	Children:
		Label@TITLE:
			X: 0
			Y: 21
			Width: PARENT_WIDTH
			Height: 25
			Text: label-ranked-panel-title
			Align: Center
			Font: Bold
		Label@STATUS:
			X: 20
			Y: 55
			Width: PARENT_WIDTH - 40
			Height: 25
			Align: Center
			Font: Bold
		Label@DETAIL:
			X: 20
			Y: 82
			Width: PARENT_WIDTH - 40
			Height: 80
			Align: Center
			VAlign: Top
			WordWrap: true
		Label@DEV_NAME_LABEL:
			X: 20
			Y: 170
			Width: 175
			Height: 25
			Align: Right
			Text: label-ranked-dev-name
		TextField@DEV_NAME:
			X: 205
			Y: 170
			Width: 160
			Height: 25
			MaxLength: 16
		Label@NICKNAME_LABEL:
			X: 20
			Y: 170
			Width: 175
			Height: 25
			Align: Right
			Text: label-ranked-nickname
		TextField@NICKNAME:
			X: 205
			Y: 170
			Width: 160
			Height: 25
			MaxLength: 16
		Label@FACTION_LABEL:
			X: 50
			Y: 170
			Width: 70
			Height: 25
			Align: Right
			Text: label-ranked-faction
		DropDownButton@FACTION:
			X: 130
			Y: 170
			Width: 180
			Height: 25
			IgnoreChildMouseOver: true
			Children:
				Image@FACTIONFLAG:
					X: 5
					Y: 5
					Width: 30
					Height: 15
				Label@FACTIONNAME:
					X: 40
					Width: 120
					Height: 25
		Label@COLOR_LABEL:
			X: 320
			Y: 170
			Width: 60
			Height: 25
			Align: Right
			Text: label-ranked-color
		DropDownButton@COLOR:
			X: 390
			Y: 170
			Width: 80
			Height: 25
			IgnoreChildMouseOver: true
			PanelAlign: Right
			Children:
				ColorBlock@COLORBLOCK:
					X: 5
					Y: 6
					Width: PARENT_WIDTH - 35
					Height: PARENT_HEIGHT - 12
		Label@MAP_BANS_LABEL:
			X: 50
			Y: 205
			Width: 70
			Height: 25
			Align: Right
			Text: label-ranked-map-bans
		DropDownButton@MAP_BANS:
			X: 130
			Y: 205
			Width: 340
			Height: 25
			Align: Left
		Button@DISCORD_BUTTON:
			X: 20
			Y: 240
			Width: 150
			Height: 25
			Text: button-ranked-discord
		Button@RENAME_BUTTON:
			X: 20
			Y: 240
			Width: 150
			Height: 25
			Text: button-ranked-rename
		Button@LEADERBOARD_BUTTON:
			X: 185
			Y: 240
			Width: 150
			Height: 25
			Text: button-ranked-leaderboard
		Button@HISTORY_BUTTON:
			X: 350
			Y: 240
			Width: 150
			Height: 25
			Text: button-ranked-history
		Label@QUEUE_STATS:
			X: 20
			Y: 278
			Width: PARENT_WIDTH - 40
			Height: 18
			Align: Center
			Font: Small
		Label@INFO:
			X: 20
			Y: 300
			Width: PARENT_WIDTH - 40
			Height: 32
			Align: Center
			VAlign: Top
			Font: Small
			WordWrap: true
		Label@VERSION:
			X: 20
			Y: 334
			Width: PARENT_WIDTH - 40
			Height: 16
			Align: Center
			Font: Tiny
		Button@PRIMARY_BUTTON:
			X: 20
			Y: PARENT_HEIGHT - 45
			Width: 180
			Height: 25
			Font: Bold
			Key: return
		Button@SECONDARY_BUTTON:
			X: 210
			Y: PARENT_HEIGHT - 45
			Width: 140
			Height: 25
			Font: Bold
		Button@BACK_BUTTON:
			X: PARENT_WIDTH - 160
			Y: PARENT_HEIGHT - 45
			Width: 140
			Height: 25
			Text: button-back
			Font: Bold
			Key: escape
		TooltipContainer@TOOLTIP_CONTAINER:

ScrollPanel@RANKED_MAP_VETO_PANEL:
	TopBottomSpacing: 5
	ItemSpacing: 5
	Width: DROPDOWN_WIDTH
	Height: 100
	Children:
		Checkbox@MAP_TEMPLATE:
			X: 5
			Width: PARENT_WIDTH - 29
			Height: 20
			Font: Regular
