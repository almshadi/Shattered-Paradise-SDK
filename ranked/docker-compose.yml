# Local development database for the ranked backend.
services:
  db:
    image: postgres:16-alpine
    container_name: sp_ranked_db
    environment:
      POSTGRES_DB: ranked
      POSTGRES_USER: ranked
      POSTGRES_PASSWORD: ranked
    ports:
      - "5442:5432"
    volumes:
      - sp_ranked_db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sp_ranked_db:
